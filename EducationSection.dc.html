<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>

<section id="education-languages" style="max-width:1080px;margin:0 auto;padding:56px 20px">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px">

    <!-- Education (03) -->
    <div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:20px">
        <span style="font-size:12px;font-weight:800;color:#4CAF50;letter-spacing:0.08em">03</span>
        <h2 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;margin:0;letter-spacing:-0.01em">{{ eduTitle }}</h2>
      </div>
      <div style="background:#FFFFFF;border:1px solid #BDBDBD;border-radius:14px;padding:22px">
        <div style="font-weight:700;font-size:15px;color:#212121;margin-bottom:4px">{{ eduCourse }}</div>
        <div style="font-size:13.5px;color:#757575;margin-bottom:10px">{{ eduSchool }}</div>
        <div style="font-size:12px;font-weight:700;color:#00838F;background:#E0F7FA;display:inline-block;padding:3px 10px;border-radius:999px">{{ eduPeriod }}</div>
      </div>
    </div>

    <!-- Languages (04) -->
    <div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:20px">
        <span style="font-size:12px;font-weight:800;color:#4CAF50;letter-spacing:0.08em">04</span>
        <h2 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;margin:0;letter-spacing:-0.01em">{{ langTitle }}</h2>
      </div>
      <div style="background:#FFFFFF;border:1px solid #BDBDBD;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px">
        <sc-for list="{{ languages }}" as="lg" hint-placeholder-count="2">
          <div>
            <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#212121;margin-bottom:6px">
              <span>{{ lg.name }}</span>
              <span style="color:#757575;font-weight:600;font-size:12.5px">{{ lg.level }}</span>
            </div>
            <div style="height:6px;background:#EEEEEE;border-radius:999px;overflow:hidden">
              <div style="height:100%;background:#4CAF50;border-radius:999px;width:{{ lg.pct }}"></div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>
</section>

</x-dc>
</body>
</html>
