<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>

<section id="experience" style="max-width:1080px;margin:0 auto;padding:56px 20px 20px">

  <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:28px">
    <span style="font-size:12px;font-weight:800;color:#4CAF50;letter-spacing:0.08em">01</span>
    <h2 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;margin:0;letter-spacing:-0.01em">{{ expTitle }}</h2>
  </div>

  <div style="display:flex;flex-direction:column">
    <sc-for list="{{ experiences }}" as="job" hint-placeholder-count="4">
      <div style="display:grid;grid-template-columns:12px 1fr;gap:14px;padding-bottom:32px">

        <!-- Timeline dot + connector -->
        <div style="display:flex;flex-direction:column;align-items:center">
          <div style="width:12px;height:12px;border-radius:50%;background:{{ job.dotColor }};flex:none;margin-top:4px;box-shadow:0 0 0 4px #C8E6C9"></div>
          <div style="width:2px;flex:1;background:#BDBDBD;margin-top:6px;display:{{ job.connectorDisplay }}"></div>
        </div>

        <!-- Job details -->
        <div style="padding-bottom:4px">
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px">
            <h3 style="font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;margin:0;color:#212121">{{ job.role }}</h3>
            <span style="font-size:12px;font-weight:700;color:#00838F;background:#E0F7FA;padding:3px 10px;border-radius:999px">{{ job.period }}</span>
          </div>
          <div style="font-size:14px;font-weight:600;color:#388E3C;margin-bottom:10px">{{ job.company }}</div>
          <sc-if value="{{ job.blurb }}" hint-placeholder-val="{{ true }}">
            <p style="font-size:13.5px;color:#757575;line-height:1.6;margin:0 0 10px">{{ job.blurb }}</p>
          </sc-if>
          <ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px">
            <sc-for list="{{ job.points }}" as="point" hint-placeholder-count="3">
              <li style="font-size:13.5px;color:#424242;line-height:1.55">{{ point }}</li>
            </sc-for>
          </ul>
        </div>

      </div>
    </sc-for>
  </div>

</section>

</x-dc>
</body>
</html>
