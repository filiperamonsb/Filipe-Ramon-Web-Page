<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>

<section id="hero" style="max-width:1080px;margin:0 auto;padding:56px 20px 40px;display:flex;flex-direction:column;gap:28px">

  <div style="display:flex;flex-direction:column;gap:20px;align-items:flex-start">

    <!-- Availability badge -->
    <div style="display:inline-flex;align-items:center;gap:8px;background:#C8E6C9;color:#1B5E20;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;letter-spacing:0.02em">
      <span style="width:7px;height:7px;border-radius:50%;background:#4CAF50;display:inline-block"></span>
      {{ statusLabel }}
    </div>

    <!-- Headline -->
    <h1 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.12;letter-spacing:-0.02em;margin:0;max-width:640px">
      {{ heroName }}<br>
      <span style="color:#388E3C">{{ heroRole }}</span>
    </h1>

    <!-- Location & contact info -->
    <div style="padding:10px 0;display:flex;flex-wrap:wrap;gap:12px 24px;font-size:13px;color:#757575;font-weight:600;width:100%">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="color:#00BCD4">●</span>Fortaleza, Ceará, Brasil
      </div>
      <a href="https://wa.me/5585986229316" target="_blank" style="display:flex;align-items:center;gap:8px;color:#757575">
        <span style="color:#00BCD4">●</span>+55 85 98622-9316
      </a>
      <a href="mailto:filipe.ramon7@gmail.com?subject=Contato%20via%20portfólio" style="display:flex;align-items:center;gap:8px;color:#757575">
        <span style="color:#00BCD4">●</span>filipe.ramon7@gmail.com
      </a>
    </div>

    <!-- Summary -->
    <p style="font-size:16px;line-height:1.65;color:#757575;margin:0;max-width:600px">{{ heroSummary }}</p>

    <!-- CTA buttons -->
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;width:100%">
      <a href="mailto:filipe.ramon7@gmail.com" style="background:#4CAF50;color:#FFFFFF;font-weight:700;font-size:14px;padding:13px 22px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto;min-width:150px">{{ ctaContact }}</a>
      <a href="https://www.linkedin.com/in/filipe-ramon" target="_blank" style="border:1.5px solid #BDBDBD;color:#212121;font-weight:700;font-size:14px;padding:13px 22px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto;min-width:120px">LinkedIn</a>
      <a href="https://github.com/filiperamon" target="_blank" style="border:1.5px solid #BDBDBD;color:#212121;font-weight:700;font-size:14px;padding:13px 22px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto;min-width:120px">GitHub</a>
    </div>

  </div>

  <!-- Stats cards -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:8px">
    <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
      <div style="background:#212121;border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:4px">
        <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;color:#FFFFFF">{{ s.value }}</div>
        <div style="font-size:12px;color:#BDBDBD;font-weight:500">{{ s.label }}</div>
      </div>
    </sc-for>
  </div>

</section>

</x-dc>
</body>
</html>
