<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>

<nav style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #BDBDBD">
  <div style="max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 20px">

    <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;letter-spacing:-0.02em;color:#212121;white-space:nowrap">
      Filipe Ramon
    </div>

    <div style="display:flex;align-items:center;gap:18px">
      <div style="display:flex;background:#F0F0F0;border-radius:999px;padding:3px;gap:2px">
        <button onClick="{{ setLangPt }}" style="border:none;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;background:{{ ptBg }};color:{{ ptColor }}">PT-BR</button>
        <button onClick="{{ setLangEn }}" style="border:none;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;background:{{ enBg }};color:{{ enColor }}">EN-US</button>
      </div>
    </div>

  </div>
</nav>

</x-dc>
</body>
</html>
