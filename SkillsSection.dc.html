<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>

<section id="skills" style="background:#212121;padding:56px 20px">
  <div style="max-width:1080px;margin:0 auto">

    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:24px">
      <span style="font-size:12px;font-weight:800;color:#4CAF50;letter-spacing:0.08em">02</span>
      <h2 style="font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;margin:0;color:#FFFFFF;letter-spacing:-0.01em">{{ skillsTitle }}</h2>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:10px">
      <sc-for list="{{ skills }}" as="sk" hint-placeholder-count="10">
        <div style="background:#333333;color:#EEEEEE;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid #424242">{{ sk }}</div>
      </sc-for>
    </div>

  </div>
</section>

</x-dc>
</body>
</html>
