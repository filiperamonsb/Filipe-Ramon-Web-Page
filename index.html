          <div style="display:flex;flex-direction:column;align-items:center">
            <div class="job-dot" style="background:${job.dotColor}"></div>
            ${i < c.experiences.length - 1 ? '<div class="job-connector"></div>' : ''}
          </div>
          <div style="padding-bottom:4px">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px">
              <h3 style="font-weight:700;font-size:17px;margin:0;color:#212121">${job.role}</h3>
              <span style="font-size:12px;font-weight:700;color:#00838F;background:#E0F7FA;padding:3px 10px;border-radius:999px">${job.period}</span>
            </div>
            <div style="font-size:14px;font-weight:600;color:#388E3C;margin-bottom:10px">${job.company}</div>
            ${job.blurb ? `<p style="font-size:13.5px;color:#757575;line-height:1.6;margin:0 0 10px">${job.blurb}</p>` : ''}
            <ul>${job.points.map(p => `<li>${p}</li>`).join('')}</ul>
          </div>
        </div>`).join('');

      // Skills
      document.getElementById('skills-list').innerHTML =
        c.skills.map(sk => `<div class="skill-tag">${sk}</div>`).join('');

      // Languages
      document.getElementById('lang-list').innerHTML = c.languages.map(lg => `
        <div>
          <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#212121;margin-bottom:6px">
            <span>${lg.name}</span><span style="color:#757575;font-weight:600;font-size:12.5px">${lg.level}</span>
          </div>
          <div class="lang-bar-track"><div class="lang-bar-fill" style="width:${lg.pct}"></div></div>
        </div>`).join('');
    }

    render();
  </script>
</body>
</html>
